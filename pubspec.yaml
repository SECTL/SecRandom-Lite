name: secrandom_lite
description: "基于 Material Design 3 的随机点名应用。"
publish_to: 'none'
version: 1.0.2+13

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  animations: ^2.0.11
  uuid: ^4.3.3
  path_provider: ^2.1.2
  path: ^1.9.0
  universal_html: ^2.0.0
  url_launcher: ^6.2.1
  http: ^1.2.0
  crypto: ^3.0.6
  # 10.x 用于自动迁移旧版 EncryptedSharedPreferences 数据；下一版本再升 11.x
  flutter_secure_storage: ^10.3.1
  app_links: ^7.0.0
  cached_network_image: ^3.3.0
  excel: ^4.0.6
  file_picker: ^13.3.0
  archive: ^3.6.1
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
