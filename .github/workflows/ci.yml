name: Test and Build Windows

# Push-triggered verification: run the test suite and compile the Windows
# runner on every pushed commit. Pushes to main additionally refresh the
# rolling "Autobuild" release so the newest Windows build sits first on the
# releases page; the versioned release pipeline in build.yml stays manual
# (workflow_dispatch) so deliberate publishing is unaffected.
on:
  push:
    # Branches only — tag pushes are already covered by the release workflow.
    branches: ['**']
  workflow_dispatch:

# Pushes to the same ref should not pile up Windows builds; the newest wins.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Build and test only need to read the repo.
permissions:
  contents: read

env:
  # Keep in sync with build.yml and the repo's `sdk: ^3.11.0` floor, which
  # 3.41.2 (Dart 3.11.0) satisfies exactly.
  FLUTTER_VERSION: '3.41.2'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      # Compiling the runner is the point of this job: it is the only place
      # windows/runner/*.cpp is actually built.
      - name: Build Windows
        run: flutter build windows --release

      - name: Read app version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml | head -1 | sed 's/+.*//')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package Windows
        shell: pwsh
        run: |
          cd build/windows/x64/runner
          Compress-Archive -Path Release/* `
            -DestinationPath SecRandom_Lite_${{ steps.version.outputs.version }}_windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: build/windows/x64/runner/SecRandom_Lite_${{ steps.version.outputs.version }}_windows.zip

  release:
    name: Publish Autobuild
    needs: [test, build-windows]
    # The rolling release tracks main only; feature branches are just built.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: windows-build
          path: artifacts/windows-build

      # Releases are ordered by creation time, so replacing assets can never
      # move an old release to the top. Deleting release + tag and recreating
      # them at the current commit is what makes Autobuild both newest and
      # pointing at the latest build. --cleanup-tag removes the tag too; the
      # API call covers the case where the tag survived an earlier partial run.
      - name: Remove previous Autobuild release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete Autobuild --yes --cleanup-tag || true
          gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/Autobuild" || true

      - name: Create Autobuild release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Autobuild
          name: Autobuild
          target_commitish: ${{ github.sha }}
          body: |
            Automated build of `main` at `${{ github.sha }}`.

            [Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: |
            artifacts/windows-build/SecRandom_Lite_*_windows.zip
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
