name: Test and Build

# Push-triggered verification: run the test suite and compile the Windows
# runner plus Linux debs (amd64 + arm64) on every pushed commit. Pushes to
# main additionally refresh the rolling "Autobuild" release so the newest
# builds sit first on the releases page; the versioned release pipeline in
# build.yml stays manual (workflow_dispatch) so deliberate publishing is
# unaffected.
on:
  push:
    # Branches only — tag pushes are already covered by the release workflow.
    branches: ['**']
  workflow_dispatch:

# Pushes to the same ref should not pile up builds; the newest wins.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Build and test only need to read the repo.
permissions:
  contents: read

env:
  # Keep in sync with build.yml and the repo's `sdk: ^3.11.0` floor, which
  # 3.41.2 (Dart 3.11.0) satisfies exactly.
  FLUTTER_VERSION: '3.41.2'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      # Compiling the runner is the point of this job: it is the only place
      # windows/runner/*.cpp is actually built.
      - name: Build Windows
        run: flutter build windows --release

      - name: Read app version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml | head -1 | sed 's/+.*//')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package Windows
        shell: pwsh
        run: |
          cd build/windows/x64/runner
          Compress-Archive -Path Release/* `
            -DestinationPath SecRandom_Lite_${{ steps.version.outputs.version }}_windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: build/windows/x64/runner/SecRandom_Lite_${{ steps.version.outputs.version }}_windows.zip

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Flutter Linux desktop is built natively. arm64 uses GitHub's free
          # arm64 runner (public repositories only) instead of cross-compiling.
          - arch: amd64
            runner: ubuntu-latest
            flutter_arch: x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            flutter_arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libgtk-3-0 libglib2.0-0 libsecret-1-dev

      # Flutter's official Linux SDK archive is x64-only, so the arm64 runner
      # cannot use subosito/flutter-action. A shallow clone of the pinned tag
      # bootstraps the arm64 Dart SDK and engine artifacts on first run.
      - name: Setup Flutter (arm64)
        if: matrix.arch == 'arm64'
        run: |
          git clone --depth 1 --branch ${{ env.FLUTTER_VERSION }} https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Setup Flutter (amd64)
        if: matrix.arch == 'amd64'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Bootstrap Flutter (arm64)
        if: matrix.arch == 'arm64'
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Build Linux
        run: flutter build linux --release

      - name: Read app version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml | head -1 | sed 's/+.*//')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package Linux
        run: |
          cd build/linux/${{ matrix.flutter_arch }}/release
          mkdir -p pkg/DEBIAN
          cat > pkg/DEBIAN/control << 'EOF'
          Package: secrandom-lutter
          Version: ${{ steps.version.outputs.version }}
          Section: utils
          Priority: optional
          Architecture: ${{ matrix.arch }}
          Maintainer: leafs825
          Description: SecRandom Lutter - A Random Roll Call Application
          EOF
          sed -i 's/^          //' pkg/DEBIAN/control
          cp -r bundle/* pkg/
          dpkg-deb --build pkg SecRandom_Lite_${{ steps.version.outputs.version }}_linux_${{ matrix.arch }}.deb

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-build-${{ matrix.arch }}
          path: build/linux/${{ matrix.flutter_arch }}/release/SecRandom_Lite_${{ steps.version.outputs.version }}_linux_${{ matrix.arch }}.deb

  release:
    name: Publish Autobuild
    needs: [test, build-windows, build-linux]
    # The rolling release tracks main only; feature branches are just built.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      # Releases are ordered by creation time, so replacing assets can never
      # move an old release to the top. Deleting release + tag and recreating
      # them at the current commit is what makes Autobuild both newest and
      # pointing at the latest build. --cleanup-tag removes the tag too; the
      # API call covers the case where the tag survived an earlier partial run.
      - name: Remove previous Autobuild release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete Autobuild --yes --cleanup-tag || true
          gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/Autobuild" || true

      - name: Create Autobuild release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Autobuild
          name: Autobuild
          target_commitish: ${{ github.sha }}
          body: |
            Automated build of `main` at `${{ github.sha }}`.

            [Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: |
            artifacts/windows-build/SecRandom_Lite_*_windows.zip
            artifacts/linux-build-amd64/SecRandom_Lite_*_linux_amd64.deb
            artifacts/linux-build-arm64/SecRandom_Lite_*_linux_arm64.deb
          draft: false
          prerelease: true
          # Prereleases cannot carry the "Latest" badge; GitHub keeps it on
          # the newest stable release instead.
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
